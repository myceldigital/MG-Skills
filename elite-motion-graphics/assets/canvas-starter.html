<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion calibration</title>
<style>
  html, body { margin: 0; background: #ece8dc; }
  canvas { display: block; }
</style>
<canvas id="scene" aria-label="A four-second looping motion calibration"></canvas>
<script type="module">
import { periodicPhase } from './motion.mjs';

const params = new URLSearchParams(location.search);
const width = Number(params.get('width') || 640);
const height = Number(params.get('height') || 360);
const canvas = document.querySelector('canvas');
canvas.width = width;
canvas.height = height;
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const duration = 4;
const ink = '#182d40';
const paper = '#ece8dc';
const accent = '#d45637';

window.seek = function seek(time) {
  if (!Number.isFinite(time)) throw new TypeError('time must be finite');
  ctx.resetTransform();
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = paper;
  ctx.fillRect(0, 0, width, height);
  const unit = Math.min(width, height);
  const phase = periodicPhase(time, duration) * Math.PI * 2;
  const vertical = height > width;
  const x = width * (vertical ? 0.5 : 0.73);
  const y = height * (vertical ? 0.67 : 0.5);
  const words = ['FORM', 'FOLLOWS', 'TIME'];
  const fontSize = unit * (vertical ? 0.115 : 0.14);
  ctx.fillStyle = ink;
  ctx.font = `700 ${fontSize}px sans-serif`;
  ctx.textBaseline = 'top';
  words.forEach((word, index) => {
    ctx.fillText(word, width * 0.08, height * (vertical ? 0.12 : 0.23) + index * fontSize * 1.16);
  });
  for (let i = 0; i < 3; i++) {
    const offset = phase + i * 0.65;
    const length = unit * (0.25 + 0.10 * Math.sin(offset));
    const thickness = unit * 0.10;
    ctx.save();
    ctx.translate(x, y + (i - 1) * unit * 0.15);
    ctx.rotate(Math.sin(offset) * 0.12);
    ctx.fillStyle = i === 1 ? accent : ink;
    ctx.beginPath();
    ctx.roundRect(-length / 2, -thickness / 2, length, thickness, thickness / 2);
    ctx.fill();
    ctx.restore();
  }
};

const toLinear = Array.from({ length: 256 }, (_, i) => {
  const c = i / 255;
  return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
});
const toSrgb = c => Math.round(255 * (c <= 0.0031308 ? c * 12.92 : 1.055 * c ** (1 / 2.4) - 0.055));

// Opaque, linear-light accumulation for a continuous scene with no hard cuts.
window.renderSamples = function renderSamples(times) {
  if (!times.length) throw new RangeError('At least one sample is required');
  if (times.length === 1) return window.seek(times[0]);
  const sums = new Float64Array(width * height * 3);
  for (const time of times) {
    window.seek(time);
    const pixels = ctx.getImageData(0, 0, width, height).data;
    for (let p = 0, q = 0; p < pixels.length; p += 4, q += 3) {
      sums[q] += toLinear[pixels[p]];
      sums[q + 1] += toLinear[pixels[p + 1]];
      sums[q + 2] += toLinear[pixels[p + 2]];
    }
  }
  const result = ctx.createImageData(width, height);
  for (let p = 0, q = 0; p < result.data.length; p += 4, q += 3) {
    result.data[p] = toSrgb(sums[q] / times.length);
    result.data[p + 1] = toSrgb(sums[q + 1] / times.length);
    result.data[p + 2] = toSrgb(sums[q + 2] / times.length);
    result.data[p + 3] = 255;
  }
  ctx.putImageData(result, 0, 0);
};

window.ready = document.fonts.load('700 32px sans-serif').then(() => {
  window.seek(0);
  if (params.get('mode') === 'preview') {
    const start = performance.now();
    function tick(now) {
      window.seek((now - start) / 1000);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
});
</script>
</html>
